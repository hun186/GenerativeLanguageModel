name: Runtime credential configuration regression

on:
  pull_request:
    paths:
      - '.github/workflows/security-credential-config.yml'
      - '.gitignore'
      - 'czjLLM/config_es/**'
      - 'czjLLM/config_sql/**'
      - 'czjLLM/config_ui/interactive_config_loader.py'
      - 'czjLLM/es_mode/entry/steps_es.py'
      - 'czjLLM/es_mode/entry/steps_es_noeventids.py'
      - 'czjLLM/job_manager/job_config.py'
      - 'czjLLM/utilities/credential_config.py'
      - 'czjLLM/utilities/private_connection_profiles.py'
      - 'czjLLM/config_sql/connection.py.example'
      - 'czjLLM/config_es/connection.py.example'
      - 'tests/security/test_private_connection_profiles.py'
      - 'czjLLM/env_examples/czjllm.env.example'
      - 'tests/security/test_credential_config.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure-Python runtime configuration and redaction regressions
        run: |
          python -m unittest discover -s tests/security -p 'test_credential_config.py' -v
          python -m unittest discover -s tests/security -p 'test_private_connection_profiles.py' -v
      - name: Syntax check for security touched loader and profiles
        run: |
          python -m compileall -q czjLLM/job_manager/job_config.py czjLLM/config_ui/interactive_config_loader.py czjLLM/utilities/credential_config.py czjLLM/utilities/private_connection_profiles.py czjLLM/es_mode/entry/steps_es.py czjLLM/es_mode/entry/steps_es_noeventids.py czjLLM/config_sql czjLLM/config_es
