name: Runtime credential configuration regression

on:
  pull_request:
    paths:
      - '.github/workflows/security-credential-config.yml'
      - '.gitignore'
      - 'czjLLM/config_es/**'
      - 'czjLLM/config_sql/**'
      - 'czjLLM/config_ui/interactive_config_loader.py'
      - 'czjLLM/job_manager/job_config.py'
      - 'czjLLM/utilities/credential_config.py'
      - 'czjLLM/env_examples/czjllm.env.example'
      - 'tests/security/test_credential_config.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure-Python runtime configuration and redaction regressions
        run: python -m unittest discover -s tests/security -p 'test_credential_config.py' -v
      - name: Syntax check for security touched loader and profiles
        run: |
          python -m compileall -q czjLLM/job_manager/job_config.py czjLLM/config_ui/interactive_config_loader.py czjLLM/utilities/credential_config.py czjLLM/config_es
