name: Changed-line secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Optional base commit SHA; if omitted, scan only the selected HEAD commit"
        required: false
        type: string

permissions:
  contents: read

jobs:
  changed-line-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve and validate comparison base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          MANUAL_BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) BASE_SHA="$PR_BASE_SHA" ;;
            push) BASE_SHA="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch)
              # A manual run has no PR base or push-before SHA.
              # An omitted input explicitly checks the selected HEAD's last commit.
              BASE_SHA="${MANUAL_BASE_SHA:-HEAD^}"
              ;;
            *) echo "Unsupported scan event" >&2; exit 2 ;;
          esac
          # Validate each selected revision, fail closed for missing or invalid bases.
          if ! git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "Secret scan base is invalid or not available in checkout" >&2
            exit 2
          fi
          if ! git rev-parse --verify "${HEAD_SHA}^{commit}" >/dev/null 2>&1; then
            echo "Secret scan head is invalid or not available in checkout" >&2
            exit 2
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Scan changed lines
        run: |
          python scripts/check_no_secrets.py --base "$BASE_SHA" --head "$HEAD_SHA"
          python -m unittest discover -s tests/security -p 'test_*.py'
