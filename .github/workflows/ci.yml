name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-linux:
    if: ${{ false }}   # 暫停此 job
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: python -m pip install -U pip setuptools wheel pytest

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          
      - name: Verify dependency graph (pip check)
        run: python -m pip check
        
      - name: Set PYTHONPATH (repo root)
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Run unit tests (exclude integration)
        run: pytest -q -m "not integration" --maxfail=1 --disable-warnings

  windows-selfhosted:
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
  
    # 先把 Secrets 映到 env，後面 steps 與 if 都可讀 env.*
    env:
      LLM_BASE_URL:  ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
      LLM_API_KEY:   ${{ secrets.LLM_API_KEY }}
      DB_CONN_STR:   ${{ secrets.DB_CONN_STR }}
  
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Install test tools
        shell: powershell
        run: python -m pip install -U pip setuptools wheel pytest
  
      - name: Cache pip
        uses: actions/cache@v4
        if: ${{ false }}  # 自架機器本地磁碟就有 pip cache，通常不需要再上傳 GitHub Cache（反而慢）。用條件關掉
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
  
      - name: Install deps
        shell: powershell
        env:
          PYTHONNOUSERSITE: 1
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          if (Test-Path requirements-dev.txt) { pip install -r requirements-dev.txt }
  
      - name: Verify dependency graph (pip check)
        shell: powershell
        env:
          PYTHONNOUSERSITE: 1
        run: python -m pip check
  
      - name: Set PYTHONPATH (repo root)
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "PYTHONPATH=$PWD"
  
      - name: Run unit tests (Windows)
        shell: powershell
        env:
          PYTHONNOUSERSITE: 1
        run: pytest -vv -m "not integration" --maxfail=3 --disable-warnings
       
      - name: Run integration tests (self-hosted only)
        # 這裡改成用 env.* 判斷（且避免在 pull_request 事件跑）
        if: ${{ github.event_name != 'pull_request' && env.LLM_BASE_URL != '' && env.LLM_MODEL_NAME != '' && env.LLM_API_KEY != '' }}
        shell: powershell
        env:
          # 測試程式用 os.getenv(...) 讀這些
          LLM_BASE_URL:  ${{ env.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ env.LLM_MODEL_NAME }}
          LLM_API_KEY:   ${{ env.LLM_API_KEY }}
          DB_CONN_STR:   ${{ env.DB_CONN_STR }}
        run: pytest -vv -m integration --maxfail=1 --disable-warnings

