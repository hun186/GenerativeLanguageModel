name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - name: Install isolated offline E2E dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements-e2e.txt
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> "$GITHUB_ENV"
      - name: Prove offline E2E dependency completeness
        run: python -m pytest --collect-only -q tests/e2e -m e2e
      - name: Run offline production E2E gate
        run: python -m pytest -q tests/e2e -m e2e --maxfail=1 --disable-warnings
      - name: Run focused LLM audit and GUI regression tests
        run: python -m pytest -q tests/job_manager/test_win_gui_llm_audit.py tests/prompt_pipeline/test_llm_call_audit.py tests/test_processing_quality.py tests/test_processing_quality_report.py --maxfail=1 --disable-warnings
      - name: Run Producer operational incident regressions
        run: python -m pytest -q tests/sql_mode/runtime/test_producer_multistage_parallelism.py --maxfail=1 --disable-warnings
      - name: Run offline LLM call failure taxonomy regressions
        run: python -m pytest -q tests/test_llm_failure_report.py tests/test_processing_quality_report.py --maxfail=1 --disable-warnings
      - name: Run focused aggregate lineage regression tests
        run: python -m pytest -q tests/reduction/test_aggregate_output.py tests/reduction/test_collection_manifest.py --maxfail=1 --disable-warnings
      - name: Run Reduction legacy artifact inventory and L3 safety regressions
        run: python -m pytest -q tests/reduction/test_legacy_artifact_audit.py tests/reduction/test_retention_l3.py --maxfail=1 --disable-warnings
      - name: Run issue 211 single-extract JSON writeback regressions
        run: python -m pytest -q tests/prompt_pipeline/test_issue_211_single_extract_writeback.py tests/test_multistage_writeback.py tests/test_combine_json_slice_merge.py tests/sql_mode/runtime/test_row_merger_flatten_targets.py --maxfail=1 --disable-warnings
      - name: Run ES multidimensional-event split writeback regressions
        run: python -m pytest -q tests/es_mode/test_multidim_event_slice_merge.py tests/es_mode/test_multidim_event_field_types.py tests/sql_mode/runtime/test_row_merger_schema_failure.py tests/test_es_sink_multifield_writeback.py --maxfail=1 --disable-warnings

  unit-linux:
    if: ${{ false }}   # 暫停此 job
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tools
        run: python -m pip install -U pip setuptools wheel pytest

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}

      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          
      - name: Verify dependency graph (pip check)
        run: python -m pip check
        
      - name: Set PYTHONPATH (repo root)
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Run unit tests (exclude integration)
        run: pytest -q -m "not integration and not e2e and not live_llm and not live_sql and not live_es and not live_e2e" --maxfail=1 --disable-warnings

  windows-selfhosted:
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
  
    # 先把 Secrets 映到 env，後面 steps 與 if 都可讀 env.*
    env:
      LLM_BASE_URL:  ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
      LLM_API_KEY:   ${{ secrets.LLM_API_KEY }}
      DB_CONN_STR:   ${{ secrets.DB_CONN_STR }}
      CZJLLM_RUN_LIVE_E2E: ${{ vars.CZJLLM_RUN_LIVE_E2E }}
      LIVE_SQL_CONN_STR: ${{ secrets.LIVE_SQL_CONN_STR }}
      LIVE_SQL_SOURCE_TABLE: ${{ vars.LIVE_SQL_SOURCE_TABLE }}
      LIVE_SQL_TARGET_TABLE: ${{ vars.LIVE_SQL_TARGET_TABLE }}
      LIVE_ES_URL: ${{ secrets.LIVE_ES_URL }}
      LIVE_ES_SOURCE_INDEX: ${{ vars.LIVE_ES_SOURCE_INDEX }}
      LIVE_ES_TARGET_INDEX: ${{ vars.LIVE_ES_TARGET_INDEX }}
      LIVE_ES_USER: ${{ secrets.LIVE_ES_USER }}
      LIVE_ES_PASS: ${{ secrets.LIVE_ES_PASS }}
      LIVE_ES_CA_CERTS: ${{ secrets.LIVE_ES_CA_CERTS }}
      LIVE_ES_VERIFY_CERTS: ${{ vars.LIVE_ES_VERIFY_CERTS }}
  
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Install test tools
        shell: powershell
        run: python -m pip install -U pip setuptools wheel pytest
  
      - name: Cache pip
        uses: actions/cache@v4
        if: ${{ false }}  # 自架機器本地磁碟就有 pip cache，通常不需要再上傳 GitHub Cache（反而慢）。用條件關掉
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
  
      - name: Install deps
        shell: powershell
        env:
          PYTHONNOUSERSITE: 1
        run: |
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          if (Test-Path requirements-dev.txt) { pip install -r requirements-dev.txt }
  
      - name: Verify dependency graph (pip check)
        shell: powershell
        env:
          PYTHONNOUSERSITE: 1
        run: python -m pip check
  
      - name: Set PYTHONPATH (repo root)
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "PYTHONPATH=$PWD"
  
      - name: Run unit tests (Windows)
        shell: powershell
        env:
          PYTHONNOUSERSITE: 1
        run: pytest -vv -m "not integration and not e2e and not live_llm and not live_sql and not live_es and not live_e2e" --maxfail=3 --disable-warnings

      - name: Run integration tests (self-hosted only)
        # 這裡改成用 env.* 判斷（且避免在 pull_request 事件跑）
        if: ${{ github.event_name != 'pull_request' && env.LLM_BASE_URL != '' && env.LLM_MODEL_NAME != '' && env.LLM_API_KEY != '' }}
        shell: powershell
        env:
          # 測試程式用 os.getenv(...) 讀這些
          LLM_BASE_URL:  ${{ env.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ env.LLM_MODEL_NAME }}
          LLM_API_KEY:   ${{ env.LLM_API_KEY }}
          DB_CONN_STR:   ${{ env.DB_CONN_STR }}
        run: pytest -vv -m integration --maxfail=1 --disable-warnings

      - name: Run live LLM tests
        if: ${{ github.event_name != 'pull_request' && env.CZJLLM_RUN_LIVE_E2E == '1' && env.LLM_BASE_URL != '' && env.LLM_MODEL_NAME != '' && env.LLM_API_KEY != '' }}
        shell: powershell
        run: pytest -vv -m live_llm --maxfail=1 --disable-warnings

      - name: Run live SQL tests
        if: ${{ github.event_name != 'pull_request' && env.CZJLLM_RUN_LIVE_E2E == '1' && env.LIVE_SQL_CONN_STR != '' && startsWith(env.LIVE_SQL_SOURCE_TABLE, 'czjllm_e2e_') && startsWith(env.LIVE_SQL_TARGET_TABLE, 'czjllm_e2e_') }}
        shell: powershell
        run: pytest -vv -m live_sql --maxfail=1 --disable-warnings

      - name: Run live Elasticsearch tests
        if: ${{ github.event_name != 'pull_request' && env.CZJLLM_RUN_LIVE_E2E == '1' && env.LIVE_ES_URL != '' && startsWith(env.LIVE_ES_SOURCE_INDEX, 'czjllm-e2e-') && startsWith(env.LIVE_ES_TARGET_INDEX, 'czjllm-e2e-') }}
        shell: powershell
        run: pytest -vv -m live_es --maxfail=1 --disable-warnings

      - name: Run complete live production smoke
        if: ${{ github.event_name != 'pull_request' && env.CZJLLM_RUN_LIVE_E2E == '1' && env.LLM_BASE_URL != '' && env.LLM_MODEL_NAME != '' && env.LLM_API_KEY != '' }}
        shell: powershell
        run: pytest -vv -m live_e2e --maxfail=1 --disable-warnings
