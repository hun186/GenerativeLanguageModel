# SQLite 多階段測試（mode=sql）
mode: sql
channel: excel_source
model_spec: gpt-oss:latest-ctx-32k-premises-MXFP4

# I/O
input_col: File
output_col: File_result
record_update_time: true
sql_config_file: czjLLM/config_sql/akconfig_local_file_test_multistage.py

# flatten 設定（多階段測試建議先開）
flatten_json_output: true
allowed_output_fields:
  - inputName
  - formalName
  - functionalDomain
  - keyFunctions
save_raw_input_when_flatten: true

# 將 JSON key 展開為主表欄位（可直接 SQL 查詢/篩選）
sql_expand_json_to_columns: true
# 若要加前綴（避免撞欄位）可開，例如：json_
# sql_expand_json_prefix: json_

# 多階段流程（保留必要兩段：route + extract）
# - route: 用 prompt（直接寫指令）
# - extract: 用 task_key（對映 taskSetting 既有任務）
stages:
  - name: route
    prompt: |
      你是分類器。請判斷此文本是否屬於「組織實體介紹」。
      只輸出 JSON：{"route":"org"} 或 {"route":"other"}
    input_from: original
    persist_output: always
    debug_print_llm_io: true
    debug_print_max_chars: 4000
    
  - name: extract
    task_key: Organization Profile Analyzer to json format
    input_from: original
    persist_output: final
    debug_print_llm_io: true
    
# 多欄位寫回（同時保留 route 與主要結果）
sql_writeback_rules:
  - output_col: File_route
    source: stage
    stage: route
  - output_col: File_result
    source: stage
    stage: extract

# flatten 來源：第 2 條 rule（0-based index=1）=> File_result
sql_flatten_writeback_rule: 1
