# sqlite_json_singlestage.yaml
# SQLite 舊版單階段格式相容性測試
# 對照：sqlite_json_singlestage_in_multistage.yaml 使用只有一個 stage 的多階段格式；
# 本檔刻意保留 legacy single-stage YAML schema（task + allowed_output_fields，無 stages）。
mode: sql
channel: excel_source
model_spec: gpt-oss:latest-ctx-32k-premises-MXFP4

# I/O（沿用 SQLite 多階段測試的來源欄位與寫回欄位）
input_col: File
output_col: File_result
record_update_time: true
save_raw_input_when_flatten: true
sql_config_file: czjLLM/config_sql/akconfig_local_file_test_multistage.py

# 舊版單階段格式：直接指定 task，不使用 stages / sql_writeback_rules / sql_flatten_writeback_rules。
# 任務核心與 sqlite_json_singlestage_in_multistage.yaml 的 extract stage 相同，
# 方便比較 legacy single-stage path 與 single-stage-in-multistage path 的輸出相容性。
task: Organization Profile Analyzer to json format
allowed_output_fields: [route, inputName, formalName, functionalDomain, keyFunctions]
#debug_print_llm_io: true
#debug_print_max_chars: -1

# merge_slices 是「跨 prompt slice」合併；單一 LLM 回覆若本身是多筆 dict 的 JSON list，
# 會保留為 list 供主欄位寫回 / flatten，不會被壓成單一 dict。
merge_slices: true

#merge_conflict_policy: prefer_left  # or prefer_right
#merge_dedup_lists: true               # 合併 list 時是否去重
merge_log_changes: true               # 合併有變化才印 log
merge_max_log: 10                     # 最多列出幾筆差異樣本
merge_log_to_file: true               # 是否落檔
merge_log_file: merge_dict_slices_audited.log
