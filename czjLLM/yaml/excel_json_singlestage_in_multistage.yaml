# excel_json_singlestage_in_multistage.yaml
# Excel 單階段 in 多階段格式相容性測試
# 對照來源：excel_json_multistage_config_with_score_route.yaml 的核心 extract 階段
mode: table
channel: excel_source
model_spec: gpt-oss:latest-ctx-32k-premises-MXFP4

# I/O（沿用 Excel 多階段測試的來源/輸出與備份目錄規範）
# 多階段 extract 階段的 org 路徑實際使用 Text 欄位作為 LLM 輸入，
# 因此單階段相容性測試也使用 Text，讓核心抽取任務的輸入與多階段 org 路徑一致。
input_col: Text
output_col: File_result
primary_key: Auto
record_update_time: true
save_raw_input_when_flatten: true

input_excel_file: czjLLM/LLMSourcePool/excel_source/LLMInput_UnitName_part.xlsx
output_excel_file: czjLLM/LLMSourcePool/excel_source/LLMInput_UnitName_part_with_result.xlsx
llm_source_backup_dir: czjLLM/LLMSourcePool_origin_backup/excel_source
llm_source_dir: czjLLM/LLMSourcePool/excel_source
target_sheet_name: LLM_result

# 舊版單任務核心：提取多階段 extract 階段中的主抽取任務，
# 不包含 score_route / route / audit_json，以便與 SQL Server / SQLite 單階段相容性測試用同一任務比較。
task: Organization Profile Analyzer to json format
allowed_output_fields: [route, inputName, formalName, functionalDomain, keyFunctions]

# merge_slices 是「跨 prompt slice」合併；單一 LLM 回覆若本身是多筆 dict 的 JSON list，
# 會保留為 list 供主欄位寫回 / flatten，不會被壓成單一 dict。
merge_slices: true

#merge_conflict_policy: prefer_left  # or prefer_right
#merge_dedup_lists: true               # 合併 list 時是否去重
merge_log_changes: true               # 合併有變化才印 log
merge_max_log: 10                     # 最多列出幾筆差異樣本
merge_log_to_file: true               # 是否落檔
merge_log_file: merge_dict_slices_audited.log
