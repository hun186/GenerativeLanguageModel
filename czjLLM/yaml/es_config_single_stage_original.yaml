channel: unspecified_channel
input_col: rawInfo.content
llm_source_backup_dir: D:/shared/TopicClassification/GenerativeLanguageModel/czjLLM/LLMSourcePool_origin_backup/unspecified_channel
llm_source_dir: D:/shared/TopicClassification/GenerativeLanguageModel/czjLLM/LLMSourcePool/unspecified_channel
#es_config_file: czjLLM/config_es/akconfig_es_test.py
es_config_file: czjLLM/config_es/akconfig_es_test_133.py
mode: es
model_spec: gpt-oss:120b-ctx-32k-premises-MXFP4
#model_spec: gpt-oss:latest-ctx-32k-premises-MXFP4
#model_spec: nemotron-3-super:latest-ctx-128k-premises-q4
output_col: multidim_event_json
# 啟用舊版多維日期補欄（time_raw/time_iso/date_iso/precision 等）；任意任務可省略。
es_payload_date_normalize_fields: [multidim_event_json]
primary_key: _id
#task: News-FacetTop10-Map-to json format
task: InfoExtraction-MultiDim-SQLFriendly-to json format

# SRAF Event-first 日期品質重跑：此政策只屬於本任務 YAML，不應放在共用連線 .py。
# Event 有合法日期或明示時間未知均可通過；不要求 Event_Timeline 一定有日期。
# null / false 明確覆寫尚未遷移的私人 .py 強制重跑條件，避免意外重算歷史資料。
# 若確實要依版本或處理時間強制重算，再於本 YAML 明確設定 pipeline_hash / force_since。
rerun:
  enable: true
  pipeline_hash: null
  force_since: null
  force_if_missing_meta: false
  fallback_date_field: update_time_ai
  required_output_checks:
    - path: multidim_event_json
      validator: multidim_event_time
      min_valid_count: 1
      relative_to_output: false

record_update_time: true
# 自動套用 mapping（僅新增欄位，不會改既有型別）
#es_apply_mapping: True
#mapping_file: czjLLM/config_es/schemas/InfoExtraction-MultiDim-mapping.yaml

merge_slices: true

#merge_conflict_policy: prefer_left  # or prefer_right
#merge_dedup_lists: true               # 合併 list 時是否去重
merge_log_changes: true               # 合併有變化才印 log
merge_max_log: 10                     # 最多列出幾筆差異樣本
merge_log_to_file: true              # 是否落檔
merge_log_file: merge_dict_slices_audited.log


