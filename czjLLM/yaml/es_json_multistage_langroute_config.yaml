# ES 多階段智慧路由設定範例（對齊 SQL/Excel 的 multistage/langroute 設定方向）
# 目前這份檔案是「多階段路由設計樣板 + 單階段相容執行設定」。
# 重要：現有 ES runner 尚未真正執行 router/routes；它只會讀入 stage_cfg 並寫入 metadata。
# 實際執行仍使用下方 task/output_col/output_profile 這組單階段相容欄位。
# 直接使用既有多階段語意的 stage_cfg / stages 命名，供未來 multistage executor 使用。
mode: es
channel: unspecified_channel
model_spec: nemotron-3-super:latest-ctx-128k-premises-q4
es_config_file: czjLLM/config_es/akconfig_es_test_133.py

input_col: rawInfo.content
primary_key: _id
record_update_time: true

# 目前實際會跑的單階段相容欄位：讀 input_col → 跑此 task → 寫 output_col。
task: InfoExtraction-MultiDim-SQLFriendly-to json format
output_col: multidim_event_json
output_profile: auto

# 以下是未來 multistage executor 要使用的路由/stages 宣告；目前只會正規化成 ctx.stage_cfg。
stage_cfg:
  name: es_json_multistage_langroute
  version: v0.1

  # router 階段只負責判斷路由，不應寫入最終 output_col。
  # 注意：現有 ES runner 尚未執行這個 router；未來 executor 執行時，
  # task: QA 會從 taskSetting 取 QA template，讀取 input_col 指向的 ES 欄位值，
  # 再把該值以 content 參數傳入 template_function(content=...)。
  router:
    name: language_route
    task: QA
    level: document
    input_col: ${input_col}
    output_col: route_lang_json
    output_profile: json
    # router 結果只供後續路由判斷時，可不寫回 ES。
    write_output: false
    route_field: route
    allowed_routes: [zh, en, mixed, fallback]
    es:
      # 未來 multistage executor 可用這些欄位為 router stage 選擇不同 index/mapping。
      src_index: ${es_src_index}
      tgt_index: ${es_tgt_index}
      mapping_file: czjLLM/config_es/schemas/route-lang-mapping.yaml

  default_route: fallback
  routes:
    zh:
      when: route == 'zh'
      stages:
        - name: zh_extraction
          task: InfoExtraction-MultiDim-SQLFriendly-to json format
          input_col: ${input_col}
          output_col: multidim_event_json
          output_profile: multidim_event
          write_output: true
          es:
            src_index: ${es_src_index}
            tgt_index: ${es_tgt_index}
            mapping_file: czjLLM/config_es/schemas/InfoExtraction-MultiDim-mapping.yaml
    en:
      when: route == 'en'
      stages:
        - name: en_extraction
          task: InfoExtraction-MultiDim-SQLFriendly-to json format
          input_col: ${input_col}
          output_col: multidim_event_json
          output_profile: multidim_event
          write_output: true
          es:
            src_index: ${es_src_index}
            tgt_index: ${es_tgt_index}
            mapping_file: czjLLM/config_es/schemas/InfoExtraction-MultiDim-mapping.yaml
    mixed:
      when: route == 'mixed'
      stages:
        - name: mixed_extraction
          task: InfoExtraction-MultiDim-SQLFriendly-to json format
          input_col: ${input_col}
          output_col: multidim_event_json
          output_profile: multidim_event
          write_output: true
          es:
            src_index: ${es_src_index}
            tgt_index: ${es_tgt_index}
            mapping_file: czjLLM/config_es/schemas/InfoExtraction-MultiDim-mapping.yaml
    fallback:
      stages:
        - name: generic_answer
          task: QA
          input_col: ${input_col}
          output_col: llm_result_json
          output_profile: json
          write_output: true
          es:
            src_index: ${es_src_index}
            tgt_index: generic-result-index
            mapping_file: czjLLM/config_es/schemas/generic-json-mapping.yaml

  stage_outputs:
    keep_intermediate: false
    meta_field: ${output_col}_meta
    final_output_col: ${output_col}
