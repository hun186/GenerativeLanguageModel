# ES 多階段智慧路由設定範例（對齊 SQL/Excel 的 multistage/langroute 設定方向）
# 這份檔案會實際執行 route -> extract -> audit_json，並用 es_writeback_rules
# 指定各 stage 的寫回欄位。
mode: es
channel: unspecified_channel
model_spec: gpt-oss:120b-ctx-32k-premises-MXFP4
#model_spec: gpt-oss:latest-ctx-32k-premises-MXFP4
es_config_file: czjLLM/config_es/akconfig_es_fishing.py

input_col: rawInfo.content
primary_key: _id
record_update_time: true

# 切片合併開關：ES 多階段抽取仍可能因 InputCutLen 產生多個切片；
# 需啟用合併，避免只把單一切片或未整併的 stage 片段寫回主欄位。
merge_slices: true
merge_conflict_policy: prefer_left
merge_dedup_lists: true
merge_log_changes: true
merge_max_log: 10

# SRAF Event-first 日期品質重跑：此政策只屬於本任務 YAML，不應放在共用連線 .py。
# Event 有合法日期或明示時間未知均可通過；不要求 Event_Timeline 一定有日期。
# null / false 明確覆寫尚未遷移的私人 .py 強制重跑條件，避免意外重算歷史資料。
# 若確實要依版本或處理時間強制重算，再於本 YAML 明確設定 pipeline_hash / force_since。
rerun:
  enable: true
  pipeline_hash: null
  force_since: null
  force_if_missing_meta: false
  fallback_date_field: update_time_ai
  required_output_checks:
    - path: multidim_event_json
      validator: multidim_event_time
      min_valid_count: 1
      relative_to_output: false

# 主要輸出欄位：多階段 ES 會由 es_writeback_rules 指定寫回 extract stage；
# 若未設定 es_writeback_rules，row_merger 會退回 combined 輸出。
output_col: multidim_event_json
output_profile: multidim_event

# 以下 stages 會由 ES/SQL/Table 共用的多階段 scheduler 執行。
stage_cfg:
  name: es_json_multistage_langroute
  version: v0.2
  default_route: fallback

  # ES 版刻意對齊 SQL multistage/langroute 的欄位：
  # - prompt：直接在 YAML 內寫提詞模板。
  # - task: "@taskSetting:..."：從 taskSetting 取既有 template。
  # - input_from：決定是否串接 original / 前一階段 / 不串接文字。
  # - max_attempts：控制單一 stage 重試次數。
  # - debug_print_llm_io/debug_print_max_chars：印出組裝後送 LLM 的 prompt。
  stages:
    - name: extract
      task: "@taskSetting:InfoExtraction-MultiDim-SQLFriendly-to json format"
      input_from: original
      input_col: rawInfo.content
      output_col: multidim_event_json
      output_profile: multidim_event
      es:
        src_index: fishing_test
        tgt_index: fishing_test
        mapping_file: czjLLM/config_es/schemas/InfoExtraction-MultiDim-mapping.yaml
      retry_source_on_route_miss: true
      persist_output: final
      write_output: true
      max_attempts: 2
      #debug_print_llm_io: true
      #debug_print_max_chars: -1
      
  stage_outputs:
    keep_intermediate: false
    meta_field: multidim_event_json_meta
    final_output_col: multidim_event_json

# ES 多階段寫回：最終主欄位應取 extract stage，而不是 route 的 zh/non_zh 或 audit stage。
# 這些規則會鏡射到既有 row_merger 的 stage 寫回解析。
es_writeback_rules:
  - output_col: multidim_event_json
    source: stage
    stage: extract
    index: fishing_test
    output_type: nested
    output_profile: multidim_event
    meta_field: multidim_event_json_meta
    mapping_file: czjLLM/config_es/schemas/InfoExtraction-MultiDim-mapping.yaml
    normalize_payload_dates: true
    meta_base:
      task: InfoExtraction-MultiDim-SQLFriendly-to json format
      stage: extract
